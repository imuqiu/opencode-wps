# ============================================================
# OpenCode WPS — CNB NPC Agent CI/CD 配置
# 5 个 NPC 角色（产品经理 / 架构师 / 全栈开发工程师 / 代码评审员 / 测试工程师）
# 角色定义见 .cnb/settings.yml
# ============================================================

# 构建 NPC 运行镜像并推送到 CNB 制品库
main:
  push:
    # 知识库入库：将仓库 docs/ 等文档切片、分词、向量化写入仓库知识库
    # （配合 codewiki 的 knowledge_enabled: true，确保仓库被标记为知识库并激活 Wiki 展示）
    - stages:
        - name: build knowledge base
          type: knowledge:update
          options:
            include: "**/**.md"
    - services:
        - docker
      stages:
        - name: Validate NPC settings & unit tests
          image: node:22
          script: |
            npm ci
            node scripts/validate-settings.js
            node scripts/validate-versions.js
            node scripts/validate-tool-counts.js
            node scripts/validate-npc-team-prompt.js
            node scripts/sync-npc-team-skill.js --check
            node tests/validate-npc-team-prompt.test.js
            node tests/taskpane-dock.test.js
            node tests/taskpane-healthcheck.test.js
            node tests/taskpane-formatsenderror.test.js
            # Windows 侧安全/Launcher 回归测试（PR #87 评审迭代新增）
            node tests/security.test.js
            node tests/launcher.test.js
            # Windows 侧 JS 语法门禁（PR #87 评审迭代新增）
            node --check opencode-wps/launcher.js
            node --check opencode-wps/serve.js
            node --check opencode-wps/opencode-proxy.js
            node --check install-addons.js
            # Mac 侧回归测试（Issue #84/86 评审新增）
            node tests/mac-bridge.test.js
            node tests/setcellformat-mac.test.js
            # Linux 支持：新增脚本语法门禁（循环全量扫描，避免漏检 handler）
            node --check launcher-linux.js
            node --check install-addons-linux.js
            node --check opencode-wps-linux/main.js
            node --check opencode-wps-linux/utils/response.js
            for f in opencode-wps-linux/handlers/*.js; do node --check "$f" || exit 1; done
            bash -n opencode-wps-linux/wps-auto.sh
            # Mac 彻底评审：补充 Mac 脚本语法门禁（与 Linux 对齐）
            node --check launcher-mac.js
            node --check install-addons-mac.js
            node --check opencode-wps-assistant/main.js
            node --check opencode-wps-assistant/utils/response.js
            for f in opencode-wps-assistant/handlers/*.js; do node --check "$f" || exit 1; done
            bash -n opencode-wps-assistant/wps-auto.sh
            cd wps-office-mcp && npm ci && npm run test:unit
        - name: Docker build
          script: |
            docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest .
            docker tag ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}
        - name: Docker push
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}

# NPC 任务（Issue/PR 评论触发 NPC）
# 可通过 options.model 指定模型 ID（如 GLM/Kimi/混元等国内模型，不指定则用平台默认）
# 模型 ID 可在 NPC 选择器或云原生开发 Agent 设置中查看可选列表
.npc_task: &npc_task
  - docker:
      image: ${CNB_DOCKER_REGISTRY}/${CNB_NPC_SLUG_LOWERCASE}:latest
    stages:
      - name: npc go
        type: npc:go
        options:
          # 指定模型 ID（取消注释并填入实际模型 ID 即可生效）
          # 模型 ID 可在 NPC 选择器或云原生开发 Agent 设置中查看可选列表
          model: deepseek-v4-flash   # DeepSeek V4 Flash 模型
          # model: hy3    # ✅ 免费模型（混元 3），不消耗 AI Credits 账单
          # model: glm-5  # GLM 模型
          # model: kimi   # Kimi 模型
          # model: hunyuan # 混元模型

# 兜底事件（仓库级别事件在此处理）
$:
  issue.comment@npc: *npc_task
  pull_request.comment@npc: *npc_task

  # Code Wiki：打 tag 时自动读取仓库代码 + docs/ 现有文档，生成项目 Wiki
  # 生成后仓库首页出现 Wiki 入口，并自动入库知识库（knowledge_enabled: true，可被 AI 问答引用）
  # 配置遵循 codewiki 插件 README 推荐模式：image 置于 stage 级 + git_doc_dir 指向工作区
  tag_push:
    - stages:
        - name: generate codewiki
          timeout: 10h
          image: cnbcool/codewiki:latest
          settings:
            git_doc_dir: /${CNB_BUILD_WORKSPACE}/${CNB_REPO_SLUG}/codewiki
            use_codebuddy: 0   # 使用 CNB AI 接入点（官方建议：不写死模型名，让插件走默认模型，见 Issue #117）
            knowledge_enabled: true   # 生成的 Wiki 自动入库仓库知识库
